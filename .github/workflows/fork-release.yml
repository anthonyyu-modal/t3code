# Fork release: builds this fork's macOS arm64 app and the macOS arm64 and
# Linux x64 CLI archives on GitHub-hosted runners, and publishes them as a
# release of this repository. CLI_RELEASE_REPOSITORY points remotes and
# runtimes here, so they install these archives instead of the official ones.
#
# Versions are on the nightly train, so the app is "T3 Code (Nightly)" with
# nightly behavior. Builds are unsigned (ad hoc), and build-desktop-artifact.ts
# gives unsigned macOS builds no update feed: Squirrel.Mac could not install an
# ad hoc update, since it checks the new build's signature against the running
# app's. Update by running this workflow and installing the new .dmg.
#
# The official release.yml also deploys web, relay, npm, and AUR with
# maintainer secrets; it stays disabled here (`gh workflow disable`).
name: Fork Release

on:
  workflow_dispatch:

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  # release-desktop.yml lists this run's artifacts (Windows wait logic).
  actions: read
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: T3 Code fork ${{ steps.release_meta.outputs.version }} (${{ steps.release_meta.outputs.short_sha }})
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - id: release_meta
        name: Resolve release version
        env:
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          node scripts/resolve-nightly-release.ts \
            --channel nightly \
            --date "$(date -u -d "$RUN_STARTED_AT" +%Y%m%d)" \
            --run-number "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --github-output

  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # No T3 Connect: the relay and Clerk settings are the maintainers' repository
  # variables, so these builds leave cloud features unconfigured.
  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  release:
    name: Publish GitHub Release
    needs: [preflight, desktop_mac_arm64, desktop_linux_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # Installers verify archives against this file, so it is written from
      # the bytes that get uploaded.
      - name: Write CLI archive checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          Fork build of [`${{ needs.preflight.outputs.ref }}`](https://github.com/${{ github.repository }}/commit/${{ needs.preflight.outputs.ref }}): upstream T3 Code plus this fork's patches ([compare](https://github.com/pingdotgg/t3code/compare/main...${{ github.repository_owner }}:t3code:${{ needs.preflight.outputs.ref }})).

          Unsigned (ad hoc) and without an update feed. Install the .dmg; if macOS says the app is damaged, run `xattr -dr com.apple.quarantine "/Applications/T3 Code (Nightly).app"`.
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          token: ${{ github.token }}
